[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-team-intel"
version = "0.1.0"
description = "Team-level Claude Code cost intelligence for engineering leaders"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Poojitha2378" }]
requires-python = ">=3.9"
keywords = ["claude", "anthropic", "cost", "ai", "engineering", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "rich>=13.0",
    "requests>=2.28",
    "anthropic>=0.30",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ccti = "cc_team_intel.cli:main"

[project.urls]
Homepage = "https://github.com/Poojitha2378/cc-team-intel"
Issues = "https://github.com/Poojitha2378/cc-team-intel/issues"

[tool.setuptools.packages.find]
include = ["cc_team_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
